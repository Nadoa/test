name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TokiSyncViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TokiSyncViewer-apk
          path: TokiSyncViewer.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TokiSync 뷰어 빌드 ${{ github.run_number }}
          body: |
            커밋: ${{ github.sha }}
            `TokiSyncViewer.apk` 를 받아 설치하세요. (디버그 키 서명, 개인 설치용)
          files: TokiSyncViewer.apk
          make_latest: true
